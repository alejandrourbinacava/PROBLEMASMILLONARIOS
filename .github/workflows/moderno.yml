name: Moderno

# Renderiza en la nube un video de la piel moderna (remotion/src/vox/video).
# La etiqueta dice que episodio: `mod-<episodio>-<n>` usa
# `vox/<episodio>.spec.json` (los planos) y `vox/<episodio>.audio.mp3`
# (voz local + musica, ya mezclados y subidos al repo).

on:
  push:
    tags:
      - "mod-*"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Episodio
        id: e
        run: |
          T="${GITHUB_REF_NAME#mod-}"
          echo "ep=${T%-*}" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
          test -f "vox/${T%-*}.spec.json"
          test -f "vox/${T%-*}.audio.mp3"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libgbm1 libxrandr2 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 libcairo2 libcups2 libxkbcommon0 libatspi2.0-0 || true
          for paquete in libasound2t64 libasound2 libatk1.0-0t64 libatk1.0-0 libatk-bridge2.0-0t64 libatk-bridge2.0-0; do
            sudo apt-get install -y -qq "$paquete" 2>/dev/null && echo "instalado $paquete"
          done

      - name: Instalar Remotion
        working-directory: remotion
        run: |
          npm ci
          npx remotion browser ensure

      # El metraje no vive en el repo: cada carpeta `stock_<tema>` esta en la
      # release `stock-<tema>`. El spec dice que ficheros usa (`medios`); se
      # baja solo lo que haga falta, con el mismo `traer_stock.py` de siempre.
      - name: Metraje
        run: |
          python3 - "vox/${{ steps.e.outputs.ep }}.spec.json" <<'PY'
          import json, sys
          spec = json.load(open(sys.argv[1], encoding="utf-8"))
          clips = [r.split("parallax2/proyecto/", 1)[1] for r in spec.get("medios", {}).values() if r.startswith("parallax2/proyecto/stock")]
          json.dump({"escenas": [{"clip": c} for c in clips]}, open("parallax2/_stock_moderno.json", "w"))
          print(len(clips), "clips de stock")
          PY
          python3 parallax2/traer_stock.py _stock_moderno.json

      - name: Render
        working-directory: remotion
        run: |
          set -o pipefail
          if ! node render-video.mjs "../vox/${{ steps.e.outputs.ep }}.spec.json" ../imagen.mp4 --concurrencia 4 2>&1 | tee ../render.log; then
            echo "::error::El render ha fallado. Ultimas lineas:"
            tail -n 30 ../render.log | while IFS= read -r linea; do echo "::error::${linea}"; done
            exit 1
          fi

      - name: Sonido
        run: |
          ffmpeg -y -v error -i imagen.mp4 -i "vox/${{ steps.e.outputs.ep }}.audio.mp3" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart "${GITHUB_REF_NAME}-1080p.mp4"
          ffmpeg -y -v error -i "${GITHUB_REF_NAME}-1080p.mp4" -vf scale=1280:720 -c:v libx264 -preset medium -crf 26 -c:a aac -b:a 96k -movflags +faststart "${GITHUB_REF_NAME}-720p.mp4"
          ls -la *.mp4

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Render de ${GITHUB_REF_NAME}." \
            "${GITHUB_REF_NAME}-1080p.mp4" "${GITHUB_REF_NAME}-720p.mp4" \
          || gh release upload "${GITHUB_REF_NAME}" "${GITHUB_REF_NAME}-1080p.mp4" "${GITHUB_REF_NAME}-720p.mp4" --clobber
