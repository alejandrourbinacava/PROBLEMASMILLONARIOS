name: Motion

# Renderiza UNA composicion de Remotion y la deja en la rama `ilustraciones`.
# Es la version corta de episodio.yml: sin guion, sin voz, sin clips. Para
# probar una pieza de motion graphics sin montar un episodio entero.
#
#     git tag motion-01 && git push origin motion-01

on:
  workflow_dispatch:
    inputs:
      composicion:
        description: Id de la composicion en Root.tsx
        default: HojaCalculo
  push:
    tags:
      - "motion-*"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: ffmpeg y fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fontconfig

      # Remotion renderiza dentro de un Chrome sin ventana y el runner no trae
      # las librerias que ese Chrome necesita. Sin ellas muere al arrancar y el
      # render sale con codigo 1 sin decir por que. Los nombres cambiaron en
      # Ubuntu 24, asi que se prueban los dos y no se corta si falta uno.
      - name: Lo que necesita el navegador
        run: |
          sudo apt-get install -y -qq \
            libnss3 libdbus-1-3 libgbm1 libxrandr2 libxfixes3 libxcomposite1 \
            libxdamage1 libpango-1.0-0 libcairo2 libcups2 libxkbcommon0 \
            libatspi2.0-0 || true
          for paquete in libasound2t64 libasound2 libatk1.0-0t64 libatk1.0-0 \
                         libatk-bridge2.0-0t64 libatk-bridge2.0-0; do
            sudo apt-get install -y -qq "$paquete" 2>/dev/null && \
              echo "instalado $paquete"
          done
          echo "listo"

      - name: Instalar Remotion
        working-directory: remotion
        run: npm ci

      - name: Que compile antes de gastar minutos
        working-directory: remotion
        run: npx tsc --noEmit -p .

      - name: Traer el navegador
        working-directory: remotion
        run: npx remotion browser ensure

      # Los logs piden credenciales aunque el repo sea publico; las
      # anotaciones no. Por eso el error se emite tambien como anotacion.
      - name: Renderizar
        working-directory: remotion
        run: |
          set -o pipefail
          mkdir -p ../ilustracion/salida
          NOMBRE="${{ inputs.composicion || 'HojaCalculo' }}"
          if ! npx remotion render "$NOMBRE" \
                 "../ilustracion/salida/${NOMBRE}.mp4" \
                 --concurrency=2 --crf=18 --log=verbose 2>&1 | tee ../render.log; then
            echo "::error::El render ha fallado. Ultimas lineas:"
            tail -n 30 ../render.log | while IFS= read -r linea; do
              echo "::error::${linea}"
            done
            exit 1
          fi

      - name: Que haya salido algo con sonido
        run: |
          NOMBRE="${{ inputs.composicion || 'HojaCalculo' }}"
          F="ilustracion/salida/${NOMBRE}.mp4"
          ls -l "$F"
          ffprobe -v error -show_entries format=duration -show_entries \
            stream=codec_type -of default=nw=1 "$F"
          # Un mp4 sin pista de audio significa que el sonido no ha entrado, y
          # eso no lo detecta el render: termina en verde igual.
          ffprobe -v error -select_streams a -show_entries stream=codec_name \
            -of csv=p=0 "$F" | grep -q . || {
              echo "::error::El video ha salido MUDO"; exit 1; }

      - name: Devolverlo al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ilustraciones
          git add -f ilustracion/salida/*.mp4 ilustracion/salida/*.png
          git commit -m "Motion renderizado en la nube" || exit 0
          git push -f origin ilustraciones

      - uses: actions/upload-artifact@v4
        with:
          name: motion
          path: |
            ilustracion/salida/*.mp4
            render.log
