name: Parallax2

# Renderiza un guion del pipeline de capas EN LA NUBE, no en el ordenador de
# casa. El render son miles de fotogramas compuestos en Pillow y deja la CPU
# clavada durante minutos; aqui no molesta a nadie.
#
# Que viene commiteado y que no:
#
#   Vienen los PNG ya RECORTADOS (parallax2/proyecto/*.png). Cuestan creditos
#   de kie.ai y regenerarlos en cada ejecucion seria pagar dos veces por lo
#   mismo. No vienen las crudas: aqui no se recorta nada.
#
#   La voz se sintetiza con edge-tts, que es GRATIS. La de pago (ai33) se deja
#   para el montaje definitivo; una prueba de imagen no tiene por que gastar.

on:
  workflow_dispatch:
    inputs:
      guion:
        description: Guion a renderizar
        type: string
        default: proyecto/episodio_banco.json
      musica:
        description: Pista de fondo de assets/music
        type: string
        default: auto
  push:
    tags:
      - "parallax-*"
      - "gancho-*"
      - "v2-*"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      # Una etiqueta no puede llevar inputs, asi que el nombre de la
      # etiqueta hace de input: `gancho-*` renderiza la prueba del gancho.
      - name: Elegir guion
        id: g
        run: |
          if [[ "${GITHUB_REF_NAME}" == gancho-* ]]; then
            echo "guion=proyecto/prueba_gancho.json" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == v2-* ]]; then
            echo "guion=proyecto/banco_v2.json" >> "$GITHUB_OUTPUT"
          else
            echo "guion=${{ inputs.guion || 'proyecto/episodio_banco.json' }}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet numpy pillow edge-tts pyyaml

      - name: Comprobar antes de gastar minutos
        working-directory: parallax2
        run: python validar.py "${{ steps.g.outputs.guion }}"

      # Dibuja cada grafico y cada rotulo antes de componer nada. `validar.py`
      # comprueba que HAYA grafico, no que se pueda dibujar: por eso un campo
      # mal escrito -"series" donde el motor espera "items"- paso limpio y
      # reviento el render a los 42 minutos con los 130 planos ya compuestos.
      - name: Que los graficos se puedan dibujar
        working-directory: parallax2
        run: python comprobar_mg.py "${{ steps.g.outputs.guion }}"

      - name: Render
        working-directory: parallax2
        # Los runners de GitHub traen 4 nucleos; se usan todos porque aqui no
        # hay nadie trabajando en la maquina.
        run: python render_par.py "${{ steps.g.outputs.guion }}" _crudo.mp4 --procesos 3

      - name: Montaje con transiciones
        working-directory: parallax2
        run: python montar.py "${{ steps.g.outputs.guion }}" _montado.mp4 --tmp _escenas

      # Si la locucion viene commiteada, se usa esa: es la voz del canal y
      # cuesta creditos de ai33, asi que no se vuelve a pedir en cada render.
      # Solo se sintetiza aqui -gratis, con edge-tts- cuando no hay ninguna.
      - name: Voz
        working-directory: parallax2
        run: |
          if [ -f voz.mp3 ]; then
            echo "usando la locucion commiteada:"
            ffprobe -v error -show_entries format=duration -of csv=p=0 voz.mp3
          else
            python voz.py "${{ steps.g.outputs.guion }}" voz.mp3 --proveedor edge
          fi

      - name: Sonido
        working-directory: parallax2
        run: |
          python sonido.py _montado.mp4 voz.mp3 salida.mp4 \
            --guion "${{ steps.g.outputs.guion }}" \
            --musica "${{ inputs.musica || 'auto' }}"

      - name: Copia ligera para el movil
        working-directory: parallax2
        run: |
          ffmpeg -y -v error -i salida.mp4 -vf scale=1280:720 \
            -c:v libx264 -preset medium -crf 26 -c:a aac -b:a 96k \
            -movflags +faststart ligero.mp4
          ls -la salida.mp4 ligero.mp4

      # La copia ligera vuelve al repo. Un artefacto pide credenciales para
      # bajarlo; un fichero en una rama se lee con una URL y ya.
      - name: Devolver la copia ligera al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ilustracion/salida
          cp parallax2/ligero.mp4 "ilustracion/salida/${GITHUB_REF_NAME}.mp4"
          git checkout -B ilustraciones
          git add -f -- ilustracion/salida
          git commit -m "Montaje ${GITHUB_REF_NAME}" || exit 0
          git push -f origin ilustraciones

      - uses: actions/upload-artifact@v4
        with:
          name: parallax2-video
          path: |
            parallax2/salida.mp4
            parallax2/ligero.mp4
          retention-days: 14
