name: Plato con Remotion

# Renderiza con Remotion UNOS POCOS planos de plato de un guion y los junta en
# un solo video, para mirarlos y medir cuanto tarda cada uno. Es la version
# corta de lo que hace `parallax2.yml` con las etiquetas `mer-r*`: sin voz, sin
# metraje, sin montar el episodio.
#
#     git tag plato-01 && git push origin plato-01
#
# Los planos de plato son los que no llevan metraje: papel cuadriculado, un
# grafico o un icono y a veces un titular. Pillow los dibuja fotograma a
# fotograma; Remotion los anima con curvas de verdad. Esto sirve para decidir
# si la diferencia compensa antes de renderizar un episodio entero.

on:
  workflow_dispatch:
    inputs:
      guion:
        description: Guion del que sacar los planos
        type: string
        default: proyecto/mercadona.json
      ids:
        description: Ids de los planos, separados por comas
        type: string
        default: ""
  push:
    tags:
      - "plato-*"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: ffmpeg y dependencias de Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig
          pip install --quiet numpy pillow edge-tts pyyaml

      # Remotion renderiza dentro de un Chrome sin ventana y el runner no trae
      # las librerias que ese Chrome necesita. Sin ellas muere al arrancar y el
      # render sale con codigo 1 sin decir por que.
      - name: Lo que necesita el navegador
        run: |
          sudo apt-get install -y -qq \
            libnss3 libdbus-1-3 libgbm1 libxrandr2 libxfixes3 libxcomposite1 \
            libxdamage1 libpango-1.0-0 libcairo2 libcups2 libxkbcommon0 \
            libatspi2.0-0 || true
          for paquete in libasound2t64 libasound2 libatk1.0-0t64 libatk1.0-0 \
                         libatk-bridge2.0-0t64 libatk-bridge2.0-0; do
            sudo apt-get install -y -qq "$paquete" 2>/dev/null && \
              echo "instalado $paquete"
          done

      - name: Instalar Remotion
        working-directory: remotion
        run: npm ci

      - name: Que compile antes de gastar minutos
        working-directory: remotion
        run: npx tsc --noEmit --jsx react-jsx --target es2020 --moduleResolution node --resolveJsonModule --esModuleInterop --skipLibCheck src/p2/RootP2.tsx

      - name: Traer el navegador
        working-directory: remotion
        run: npx remotion browser ensure

      - name: Sacar los planos de plato del guion
        working-directory: parallax2
        run: python exportar_platos.py "${{ inputs.guion || 'proyecto/mercadona.json' }}" ../platos.json

      - name: Renderizar con Remotion
        working-directory: remotion
        run: |
          set -o pipefail
          IDS="${{ inputs.ids }}"
          if [ -z "$IDS" ]; then
            IDS="gancho_02,gancho_05,gancho_08x,gancho_09c,cap1_03c,cap2_03,cap3_02,cap3_03b,cap1_02,cap2_02,cap3_10c"
          fi
          mkdir -p ../parallax2/_escenas
          if ! node render-platos.mjs ../platos.json ../parallax2/_escenas \
                 --ids "$IDS" 2>&1 | tee ../render.log; then
            echo "::error::El render ha fallado. Ultimas lineas:"
            tail -n 30 ../render.log | while IFS= read -r linea; do
              echo "::error::${linea}"
            done
            exit 1
          fi

      - name: Juntarlos en un solo video
        run: |
          cd parallax2/_escenas
          ls -1 *.mp4 | sed "s/^/file '/; s/$/'/" > lista.txt
          ffmpeg -y -v error -f concat -safe 0 -i lista.txt -c copy ../../plato-prueba.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 ../../plato-prueba.mp4
          ls -l ../../plato-prueba.mp4

      - name: Publicarlo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp plato-prueba.mp4 "${GITHUB_REF_NAME}.mp4"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Planos de plato renderizados con Remotion. Mira render.log en el artefacto para los tiempos." \
            "${GITHUB_REF_NAME}.mp4" render.log \
          || gh release upload "${GITHUB_REF_NAME}" "${GITHUB_REF_NAME}.mp4" render.log --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plato
          path: |
            plato-prueba.mp4
            render.log
