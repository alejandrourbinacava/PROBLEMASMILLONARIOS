# ============================================================
#  PROBLEMAS MILLONARIOS — configuración del canal
#  Todo lo ajustable vive aquí. No hace falta tocar código.
# ============================================================

brand:
  name: "Problemas Millonarios"
  handle: "@problemasmillonariosoficial"
  language: "es-ES"
  # Color de acento para subtítulos, miniatura y remates gráficos
  # Fuente de marca (rótulos y miniatura). Descarga el catálogo con
  # python scripts/fetch_fonts.py y elige: Baloo 2 | Fredoka | Nunito |
  # M PLUS Rounded 1c | Quicksand | Poppins
  font_family: "Poppins"
  font_fallback: "DejaVu Sans"
  accent: "#FFD400"
  accent_2: "#FF2D55"

# ---------------- GUION ----------------
script:
  provider: "anthropic"          # anthropic | openai | manual
  model: "claude-sonnet-5"       # si provider=openai -> p.ej. gpt-4o
  target_minutes: 13             # objetivo 10-15
  words_per_minute: 165          # ritmo de narración en español energético
  # Bloques temáticos del vídeo (se convierten en capítulos de YouTube)
  min_blocks: 7
  max_blocks: 10

# ---------------- VOZ ----------------
voice:
  # genaipro = de pago, con tu API key
  # edge     = GRATIS, sin clave. Voces es-ES-AlvaroNeural / ElviraNeural /
  #            XimenaNeural. Además devuelve la posición exacta de cada
  #            palabra, así que la imagen cuadra al milisegundo.
  provider: "genaipro"
  base_url: "https://genaipro.io/api/v1"
  # Con provider edge: es-ES-AlvaroNeural | es-ES-ElviraNeural | es-ES-XimenaNeural
  # Con provider genaipro: el id que saques de python scripts/list_voices.py
  voice_id: "RwzBDEn5f6FIgpAjH9YN"
  model_id: "eleven_multilingual_v2"
  speed: 1.05                    # 0.7 - 1.2
  stability: 0.45
  similarity: 0.80
  style: 0.35
  speaker_boost: true
  # LUFS objetivo de la narración final
  loudness_lufs: -15.0
  # block  = una llamada por capítulo. Prosodia natural, sincronía por subtítulos.
  # scene  = una llamada por escena. Sincronía perfecta, prosodia algo más plana
  #          y ~200 llamadas por vídeo. Cambia a "scene" solo si ves desfase.
  tts_granularity: "block"
  parallel_requests: 4           # llamadas simultáneas a GenAIPro
  # Silencio insertado entre capítulos, da respiro y marca el cambio de tema
  gap_between_blocks_s: 0.35

# ---------------- RITMO DE MONTAJE ----------------
edit:
  width: 1920
  height: 1080
  fps: 30
  # Calidad/velocidad. Los planos sueltos se codifican rápido porque se
  # recodifican una sola vez; la pasada final es la que se ve, así que ahí
  # merece la pena gastar más tiempo.
  preset: "veryfast"             # planos intermedios
  segment_crf: 20
  master_preset: "medium"        # pasada final
  master_crf: 19
  # HOOK: microcortes de dopamina en los primeros segundos
  hook:
    enabled: true
    duration_s: 5.0              # cuánto dura el troceo rápido; después
                                 # los cortes desaceleran solos
    cut_min_s: 0.28              # corte más rápido
    cut_max_s: 0.55              # corte más lento
    flash_frames: 0              # flash blanco entre cortes (0 = sin flash)
    # Sonido en cada corte rápido: whoosh (el tuyo) | shutter | none
    sfx: "whoosh"
    zoom_punch: 0.10             # golpe de zoom en cada corte (0 = off)
  # CUERPO: escena nueva cada 3-5 s
  body:
    scene_min_s: 3.0
    scene_max_s: 5.0
    whoosh_sfx: true
    whoosh_every_n_cuts: 2       # 1 = en todos; 2 = uno sí uno no (menos fatiga)
    ken_burns: true              # zoom lento continuo en cada clip
    ken_burns_amount: 0.07       # 7% de zoom a lo largo de la escena
  grade:
    enabled: true
    contrast: 1.06
    saturation: 1.12
    vignette: true

# ---------------- B-ROLL ----------------
broll:
  # Qué parte del vídeo sale del fondo de clips del tema. El resto usa la
  # búsqueda concreta de cada frase. El hook, los planos con cifra y las
  # aperturas de capítulo llevan siempre material del tema.
  # Cuánto tiene que pegar un clip del fondo con la frase para usarlo.
  # Si no llega, se busca uno específico para esa frase: manda lo que se
  # dice, no que el clip sea del tema.
  min_relevance: 0.34
  brand_ratio: 0.70
  brand_cooldown: 12             # planos que deben pasar antes de repetir uno
  brand_per_query: 9             # cuántos coger de cada búsqueda de anclaje
  # Qué tiene que verse en el clip para aceptarlo. Vacío = se deducen de
  # los anclajes. Es el filtro que evita que entre un restaurante de
  # manteles buscando "fast food restaurant".
  keywords: []
  # Términos que solo aparecen si SE VE la marca. Esos clips se reservan
  # para el hook, los planos con cifra y las aperturas de capítulo.
  keywords_primary: []
  # Contenido vetado pase lo que pase. Vacío = lista por defecto
  # (protestas, guerra, accidentes, funerales...). Un canal automático
  # publica sin que nadie revise los clips: sin esto, una manifestación
  # puede acabar debajo de una cifra.
  blocklist: []
  # Vacío = se leen de topics.yml o del guion. Aquí puedes forzarlos.
  anchors: []
  # Tus propios clips van en assets/broll/<slug-del-tema>/ y en
  # assets/broll/_comun/. Se usan ANTES que nada del stock: es la única forma
  # de tener el 100% del vídeo con material de la marca.

# ---------------- SUBTÍTULOS QUEMADOS ----------------
captions:
  # OFF. Las cifras en el centro ya cuentan el vídeo sin audio y los
  # subtítulos permanentes ensucian la imagen.
  enabled: false
  max_chars_per_cue: 22          # 2-4 palabras por cue = estilo TikTok/Milly
  # Fuente: se descarga a assets/fonts/ con scripts/fetch_fonts.py.
  # Si falla, cae a la fuente de sistema indicada en font_fallback.
  font_family: "Anton"
  font_fallback: "DejaVu Sans"
  font_size: 96
  outline: 7
  shadow: 3
  margin_bottom: 170
  uppercase: true
  highlight_numbers: true        # cifras y € en color acento

# ---------------- RÓTULOS DE CIFRAS ----------------
# Regla del canal: si se dice un número, sale en pantalla. En el centro, grande
# y con un golpe de sonido. El detector entiende números escritos en letra
# ("un millón doscientos mil euros" -> 1,2 M€) y rangos ("entre 60 y 70").
figures:
  enabled: true
  font_size: 200                 # se reduce solo si la cifra no cabe a lo ancho
  outline: 12
  shadow: 7
  hold_s: 1.7                    # cuánto aguanta el rótulo en pantalla
  min_gap_s: 1.4                 # separación mínima entre dos rótulos
  color: "#FFFFFF"               # blanco. Vacío = brand.accent (amarillo)
  sound: true                    # golpe (assets/sfx/pop.wav) en cada cifra
  sound_db: 3.0                  # el golpe tiene que oírse por encima de la voz

# ---------------- AUDIO ----------------
audio:
  # Estilo del sonido de transición. Escúchalos con:
  #   python scripts/preview_sfx.py
  #   sweep  barrido ascendente con cuerpo (el estándar)
  #   riser  sube y corta en seco, muy agresivo
  #   swish  corto y seco, el menos invasivo
  #   sub    aire arriba y golpe de grave, el más 'de canal grande'
  whoosh_style: "sweep"          # solo si assets/sfx/whoosh/ está vacío
  opening_impact: false          # golpe en el segundo 0 del vídeo
  # Un sonido de transición más largo que esto sigue sonando dentro del
  # plano siguiente y se oye como ruido sin motivo. No se usa como corte.
  max_transition_s: 1.2
  # Las pistas de assets/music/ YA vienen normalizadas a -20 LUFS por
  # fetch_music.py, así que esto es solo un retoque. Antes ponía -22 dB
  # ENCIMA de un archivo ya bajado: la música acababa a -45 LUFS contra
  # una voz a -15, o sea inaudible.
  music_volume_db: -3.0
  duck_db: -12.0                 # cuánto baja la música cuando habla la voz
  sfx_volume_db: -6.0

# ---------------- YOUTUBE ----------------
youtube:
  privacy: "private"             # la API no crea borradores reales; privado = tu borrador
  category_id: "24"              # 24 = Entertainment
  made_for_kids: false
  # Se rellenan solos, pero puedes forzar sufijo de marca
  title_max_chars: 95
  tags_max_chars: 500
  default_playlist: ""           # ID de playlist opcional
